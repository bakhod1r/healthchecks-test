services:
  healthchecks:
    image: healthchecks/healthchecks:latest
    environment:
      DB: sqlite
      DB_NAME: /data/hc.sqlite
      SECRET_KEY: secret-key
      SITE_ROOT: http://localhost:7077
      PING_ENDPOINT: http://localhost:7077/ping/
      REGISTRATION_OPEN: "True"
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
    ports:
      - "7077:8000"
    volumes:
      - hc-data:/data

  backend:
    build: .
    ports:
      - "8080:8080"

volumes:
  hc-data:
