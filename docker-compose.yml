services:
  healthchecks:
    image: healthchecks/healthchecks:latest
    environment:
      DB: sqlite
      DB_NAME: /data/hc.sqlite
      SECRET_KEY: local-dev-only-change-me
      SITE_ROOT: http://localhost:8000
      PING_ENDPOINT: http://healthchecks:8000/ping/
      REGISTRATION_OPEN: "True"
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    volumes:
      - hc-data:/data

  backend:
    build: .
    ports:
      - "8080:8080"

  cron:
    build: ./cron
    environment:
      HC_PING_URL: ${HC_PING_URL:?set HC_PING_URL to the check ping URL}
      BACKEND_URL: http://backend:8080
    depends_on: [backend, healthchecks]

volumes:
  hc-data:
